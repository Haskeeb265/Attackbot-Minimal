version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: attackbot-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: attackbot
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: attackbot

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attackbot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: